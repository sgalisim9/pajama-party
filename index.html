{b:1,sk:'#cf9c78',c:'#2a2f33',c2:'#e8dfc8',p:'trees',h:'bun',i:'mug',mc:'#c8202c',idle:['talk','laugh']},
{b:1,sk:'#b87a52',c:'#1b1b1e',c2:'#58a96b',p:'trees',h:'short',idle:['wave','laugh']}];
const stage=$('stage'),C=D.map((o,i)=>{if(o.b){const k=i-4;o.x=128+k*184-78;o.y=926;o.t=k<5?'r':'l'}
 const e=document.createElement('div'),W=o.b?157:190,H=o.b?149:266;e.className='char'+(o.i?' hold':'');
 e.style.cssText=`left:${o.x}px;top:${o.y}px;width:${W}px;height:${H}px;--s:${o.t=='l'?1:-1};--pt:${o.b?150:95}deg;--lean:${o.t=='r'?6:-6}deg;--d:${4+R()*3|0}s`;
 e.innerHTML=build(o,'p'+i);const sv=e.querySelector('svg');if(o.b){sv.setAttribute('viewBox','0 20 200 190');sv.style.overflow='hidden'}sv.style.animationDelay=`-${R()*5|0}s`;stage.appendChild(e);return{e,o}});
function act(c,a,ms){if(c.o.b&&a=='clap')a='cheer';c.e.classList.add('act-'+a);setTimeout(()=>c.e.classList.remove('act-'+a),ms)}
let busy=0,vid=false;
function idle(c){setTimeout(()=>{if(Date.now()>busy&&!vid)act(c,pick(c.o.idle),2200+R()*1600);idle(c)},3500+R()*6500)}
C.forEach(idle);
function say(t){$('cap').firstChild.textContent=t;$('title').classList.add('hide');const c=$('cap');c.classList.remove('go');void c.offsetWidth;c.classList.add('go');setTimeout(()=>$('title').classList.remove('hide'),2500)}
function burst(l,ms){busy=Date.now()+ms+800;C.forEach(c=>setTimeout(()=>act(c,pick(l),ms),R()*600))}
function photoEv(){burst(['point','point','wave','cheer','jump'],2300);say('LOOK AT THAT!')}
function vidOn(){vid=true;C.forEach(c=>{c.e.classList.add('act-look');if(R()<.6)c.e.classList.add('lean')})}
function vidOff(){if(!vid)return;vid=false;C.forEach(c=>c.e.classList.remove('act-look','lean'))}
function vidEnd(){vidOff();burst(['clap','clap','cheer','laugh','jump'],3000);say('WOOHOO!')}
/* ---------- slideshow ---------- */
const Q=[],scr=$('screen');let cur=0,tm,paused=false;
const later=(fn,ms)=>{clearTimeout(tm);tm=setTimeout(function f(){paused?tm=setTimeout(f,500):fn()},ms)};
function show(i){if(!Q.length)return;i=(i+Q.length)%Q.length;cur=i;clearTimeout(tm);vidOff();const it=Q[i],el=document.createElement(it.v?'video':'img');$('ph').style.display='none';el.className='m';el.src=it.u;
 const place=()=>{scr.querySelectorAll('.m.on').forEach(o=>{o.classList.remove('on');setTimeout(()=>o.remove(),1200)});scr.appendChild(el);requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.add('on')))};
 if(it.v){el.playsInline=true;el.onplaying=()=>{if(!el.dataset.s){el.dataset.s=1;place();vidOn()}};el.onended=()=>{vidEnd();later(()=>show(i+1),3200)};el.onerror=()=>show(i+1);el.play().catch(()=>{})}
 else{el.onload=()=>{place();photoEv();later(()=>show(i+1),7000)};el.onerror=()=>show(i+1)}}
function add(fs){const was=Q.length;[...fs].filter(f=>/^(image|video)/.test(f.type)).sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true})).forEach(f=>Q.push({u:URL.createObjectURL(f),v:f.type.startsWith('video')}));if(!was&&Q.length)show(0)}
const file=$('file');file.onchange=()=>{add(file.files);file.value=''};
$('add').onclick=$('ph').onclick=()=>file.click();
$('prev').onclick=()=>show(cur-1);$('next').onclick=()=>show(cur+1);
$('pp').onclick=()=>{paused=!paused;$('pp').textContent=paused?'▶':'⏸';const v=scr.querySelector('video.on');if(v)paused?v.pause():v.play()};
const fsT=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();$('fs').onclick=fsT;
addEventListener('keydown',e=>{if(e.key=='f')fsT();if(e.key=='ArrowRight')show(cur+1);if(e.key=='ArrowLeft')show(cur-1);if(e.key==' '){e.preventDefault();$('pp').click()}});
addEventListener('dragover',e=>e.preventDefault());addEventListener('drop',e=>{e.preventDefault();add(e.dataTransfer.files)});
let ht;const ctl=$('ctl');const wake=()=>{ctl.classList.remove('h');clearTimeout(ht);ht=setTimeout(()=>ctl.classList.add('h'),3500)};addEventListener('mousemove',wake);addEventListener('touchstart',wake);wake();
function fit(){const k=Math.min(innerWidth/1920,innerHeight/1080);stage.style.transform=`translate(${-960*k}px,${-540*k}px) scale(${k})`}
addEventListener('resize',fit);fit();


/* ---------- TV: shows media approved on the admin page ---------- */
const IDS=new Map();
function addItem(id,buf,mime,isV){if(IDS.has(id))return;const it={id,u:URL.createObjectURL(new Blob([buf],{type:mime})),v:isV};IDS.set(id,it);Q.splice(Q.length?cur+1:0,0,it);if(Q.length==1)show(0)}
function rmItem(id){const i=Q.findIndex(x=>x.id===id);if(i<0)return;const it=Q.splice(i,1)[0];IDS.delete(id);URL.revokeObjectURL(it.u);
 if(!Q.length){clearTimeout(tm);vidOff();scr.querySelectorAll('.m').forEach(o=>o.remove());$('ph').style.display='flex'}else{if(i<cur)cur--;else if(i==cur)show(cur)}}
(function(){try{const ls=localStorage,rs=()=>Math.random().toString(36).slice(2,8);let room=ls.getItem('pp_room'),key=ls.getItem('pp_key');
 if(!room){room=rs();ls.setItem('pp_room',room)}if(!key){key=rs()+rs();ls.setItem('pp_key',key)}
 const base=u=>new URL(u,location.href).href,guest=base('c.html')+'#'+room,adminUrl=base('admin.html')+'#'+room+'.'+key;
 if(window.qrcode&&/^https?:/.test(location.protocol)){const q=qrcode(0,'M');q.addData(guest);q.make();const s=q.createSvgTag({cellSize:4,margin:0,scalable:true});$('qrimg').innerHTML=s;$('qrimg2').innerHTML=s;$('qr').style.display='block'}
 $('adb').onclick=()=>window.open(adminUrl,'_blank');
 $('cpl').onclick=()=>{const f=()=>prompt('Copy this admin link and open it on the phone or computer that will approve uploads:',adminUrl);navigator.clipboard?navigator.clipboard.writeText(adminUrl).then(()=>alert('Admin link copied. Open it on the device that will approve uploads.'),f):f()};
 const big=()=>$('qrbig').classList.toggle('on');$('qr').onclick=big;$('qrbig').onclick=big;$('qrb').onclick=big;addEventListener('keydown',e=>{if(e.key=='q')big()});
 if(window.Peer){let p;const up=()=>{try{p&&p.destroy()}catch(x){}p=new Peer('ccxm-tv-'+room);
  p.on('connection',c=>{let ok=0;c.on('data',d=>{if(!ok){if(d&&d.hello===key){ok=1;c.send({ready:1})}else c.close();return}if(d.cmd=='add')addItem(d.id,d.buf,d.mime,d.k=='video');if(d.cmd=='rm')rmItem(d.id)})});
  p.on('disconnected',()=>setTimeout(()=>p.reconnect(),1000));p.on('error',()=>setTimeout(up,4000))};up()}
}catch(e){console.log(e)}})();
