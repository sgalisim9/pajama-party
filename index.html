<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Customer Care x Marketing | Christmas Pajama Party</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
html,body{margin:0;height:100%;background:#2a1410;overflow:hidden;font-family:'Trebuchet MS',Verdana,sans-serif}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden}
#bg,#snow{position:absolute;inset:0;width:1920px;height:1080px}
#snow i{position:absolute;top:-30px;color:#fff;opacity:.8;animation:fall linear infinite;text-shadow:0 0 6px #fff}
@keyframes fall{to{transform:translate(60px,1130px) rotate(360deg)}}
#screen{position:absolute;left:220px;top:88px;width:1480px;height:843px;box-sizing:border-box;border:12px solid #7a4421;border-radius:14px;background:#0d0706;overflow:hidden;box-shadow:0 0 0 4px #e8b94a,0 0 40px 8px rgba(255,200,90,.55),0 12px 30px rgba(0,0,0,.5);z-index:5}
.m{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity 1.1s;background:#000}
.m.on{opacity:1}img.m.on{animation:kb 10s linear forwards}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.035)}}
#ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fbe7c4;background:radial-gradient(circle,#7a1f24,#3a0e12);font-size:44px;cursor:pointer}
#ph small{font-size:26px;opacity:.85;margin-top:14px}
#title{position:absolute;left:0;width:1920px;top:2px;text-align:center;z-index:6;pointer-events:none}
#title b{display:block;font:900 42px/1 'Trebuchet MS',sans-serif;color:#c8202c;letter-spacing:2px;paint-order:stroke fill;-webkit-text-stroke:10px #fff;text-shadow:0 4px 0 #e9d9c0;text-transform:uppercase}
#title span{display:block;font-size:16px;margin-top:2px;color:#6a1a1a;font-weight:bold;text-shadow:0 1px 0 #fff8}
#cap{position:absolute;left:0;width:1920px;top:6px;text-align:center;z-index:7;pointer-events:none;opacity:0}
#cap b{display:inline-block;font:900 44px/1 'Trebuchet MS',sans-serif;color:#fff;background:#c8202c;border:5px solid #f4c542;border-radius:40px;padding:6px 38px;box-shadow:0 0 25px #f4c542}
#cap.go{animation:pop 2.6s ease-out}
@keyframes pop{0%{opacity:0;transform:scale(.3) rotate(-6deg)}10%{opacity:1;transform:scale(1.15) rotate(3deg)}18%{transform:scale(1) rotate(-2deg)}80%{opacity:1}100%{opacity:0;transform:scale(1)}}
#title.hide{opacity:0}#title{transition:opacity .3s}
.char{position:absolute;transform-origin:50% 100%;transition:transform .8s ease;z-index:4;--s:-1}
.char .in{width:100%;height:100%}
.char svg{width:100%;height:100%;overflow:visible;transform-origin:50% 100%;animation:sway var(--d,5s) ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-1.3deg) scaleY(1)}to{transform:rotate(1.3deg) scaleY(1.015)}}
.char.lean{transform:rotate(var(--lean)) scale(1.04)}
.eye{animation:bl 5s infinite;transform-box:fill-box;transform-origin:center}
@keyframes bl{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
.arm{transition:transform .5s ease}
.ca{transform:rotate(calc(var(--s)*-8deg))}.oa{transform:rotate(calc(var(--s)*8deg))}
.hold .oa{transform:rotate(calc(var(--s)*75deg))}
.act-point .ca{transform:rotate(calc(var(--s)*var(--pt)))}
.act-wave .ca{animation:wv .7s infinite ease-in-out}
@keyframes wv{0%,100%{transform:rotate(calc(var(--s)*125deg))}50%{transform:rotate(calc(var(--s)*162deg))}}
.act-clap .ca{animation:cl .34s infinite ease-in-out}.act-clap .oa{animation:cl2 .34s infinite ease-in-out}
@keyframes cl{0%,100%{transform:rotate(calc(var(--s)*-60deg))}50%{transform:rotate(calc(var(--s)*-88deg))}}
@keyframes cl2{0%,100%{transform:rotate(calc(var(--s)*60deg))}50%{transform:rotate(calc(var(--s)*88deg))}}
.act-jump .in{animation:jump .55s ease-out 3}
@keyframes jump{0%,100%{transform:translateY(0)}40%{transform:translateY(-34px)}}
.head{transform-origin:100px 150px;transition:transform .6s}
.act-look .head{transform:translateX(calc(var(--s)*-7px)) rotate(calc(var(--s)*-5deg))}
.act-talk .head{animation:tk 1.3s infinite ease-in-out}
@keyframes tk{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
.act-laugh .head{animation:lg .26s infinite alternate}
@keyframes lg{from{transform:translateY(0) rotate(-3deg)}to{transform:translateY(-5px) rotate(3deg)}}
.mo{opacity:0;transform-box:fill-box;transform-origin:50% 0}
.act-talk .mo,.act-laugh .mo{opacity:1;animation:mt .3s infinite alternate}
.act-talk .sm,.act-laugh .sm{opacity:0}
@keyframes mt{from{transform:scaleY(.25)}to{transform:scaleY(1)}}
.tw{animation:tw 2.4s infinite ease-in-out}
@keyframes tw{0%,100%{opacity:.35}50%{opacity:1}}
.sw{animation:swing 4.5s infinite ease-in-out}
@keyframes swing{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
#ctl{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:8px;z-index:20;transition:opacity .5s;background:#000a;padding:8px 12px;border-radius:30px}
#ctl.h{opacity:0;pointer-events:none}
#ctl button{font:bold 15px 'Trebuchet MS',sans-serif;border:0;border-radius:20px;padding:8px 16px;background:#c8202c;color:#fff;cursor:pointer}
#ctl button:hover{background:#e23a46}
.act-cheer .ca{animation:c1 .5s infinite ease-in-out}.act-cheer .oa{animation:c2 .5s infinite ease-in-out}
@keyframes c1{0%,100%{transform:rotate(calc(var(--s)*135deg))}50%{transform:rotate(calc(var(--s)*165deg))}}
@keyframes c2{0%,100%{transform:rotate(calc(var(--s)*-135deg))}50%{transform:rotate(calc(var(--s)*-165deg))}}
.char .in{transform-origin:50% 100%}.char img{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
.bd{position:absolute;inset:0;transform-origin:50% 100%;animation:sway var(--d,5s) ease-in-out infinite alternate}
.hd{animation:nod var(--d2,6s) ease-in-out infinite alternate}@keyframes nod{from{transform:rotate(-1.6deg)}to{transform:rotate(1.6deg)}}
.char.side{-webkit-mask-image:linear-gradient(#000 78%,transparent);mask-image:linear-gradient(#000 78%,transparent)}
.act-talk .hd{animation:tk 1.1s infinite ease-in-out}.act-laugh .hd{animation:lg .26s infinite alternate}
.act-look .hd{animation:none;transform:rotate(calc(var(--s)*4deg))}
.act-wave .in,.act-cheer .in{animation:wig .6s infinite ease-in-out}@keyframes wig{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg) translateY(-4px)}}
.act-point .in{transform:rotate(calc(var(--s)*8deg)) translateY(-8px) scale(1.06)}.in{transition:transform .5s}
.act-clap .in{animation:clp .34s infinite ease-in-out}@keyframes clp{0%,100%{transform:scale(1)}50%{transform:scale(1.05,.96)}}
.act-jump .in{animation:jump .55s ease-out 3}
