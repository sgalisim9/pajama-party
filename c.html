<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Send to the TV | Customer Care x Marketing</title>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:'Trebuchet MS',Verdana,sans-serif;color:#fff}
#v{position:fixed;inset:0;width:100%;height:100%;object-fit:cover}#v.mir{transform:scaleX(-1)}
#top{position:fixed;top:max(10px,env(safe-area-inset-top));left:0;right:0;text-align:center;z-index:5}
#st{background:#000a;padding:6px 14px;border-radius:20px;font-size:14px}
#ctl{position:fixed;right:max(16px,env(safe-area-inset-right));top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:18px;align-items:center;z-index:5}
#ctl button{border:0;border-radius:50%;cursor:pointer;color:#fff;font-size:22px}
#shot{width:78px;height:78px;background:#fff;border:6px solid #c8202c!important}
#rec{width:52px;height:52px;background:#c8202c}#rec.on{animation:bl 1s infinite}
#flip{width:46px;height:46px;background:#0008}
@keyframes bl{50%{opacity:.4}}
#rot{position:fixed;inset:0;background:#7a1f24;display:none;align-items:center;justify-content:center;text-align:center;font-size:22px;z-index:9;padding:30px}
#rot i{display:block;font-style:normal;font-size:70px;animation:tw 2s infinite ease-in-out}
@keyframes tw{0%,100%{transform:rotate(0)}50%{transform:rotate(-90deg)}}
@media (orientation:portrait){#rot{display:flex}#ctl{display:none}}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#2f7d4a;padding:10px 20px;border-radius:24px;opacity:0;transition:opacity .3s;z-index:6}
</style></head><body>
<video id="v" autoplay playsinline muted></video>
<div id="top"><span id="st">Starting camera…</span></div>
<div id="ctl"><button id="flip">⟲</button><button id="shot"></button><button id="rec">●</button></div>
<div id="rot"><div><i>📱</i><p>Turn your phone sideways<br>for a landscape photo or video 🎄</p></div></div>
<div id="toast"></div>
<script>
const $=i=>document.getElementById(i),room=location.hash.slice(1);let stream,face='user',conn,peer,rec,chunks,tmo;
function toast(t){const e=$('toast');e.textContent=t;e.style.opacity=1;clearTimeout(e.t);e.t=setTimeout(()=>e.style.opacity=0,2500)}
async function cam(){if(stream)stream.getTracks().forEach(t=>t.stop());
 const vc={facingMode:face,width:{ideal:1920},height:{ideal:1080}};
 try{stream=await navigator.mediaDevices.getUserMedia({video:vc,audio:true})}catch(e){try{stream=await navigator.mediaDevices.getUserMedia({video:vc})}catch(e2){$('st').textContent='Camera blocked - please allow camera access';return}}
 $('v').srcObject=stream;$('v').classList.toggle('mir',face=='user')}
function link(){if(!room){$('st').textContent='Scan the QR code on the TV';return}
 if(peer)peer.destroy();if(!window.Peer){$('st').textContent='Could not load - check internet';return}
 peer=new Peer();$('st').textContent='Connecting to the TV…';
 peer.on('open',()=>{conn=peer.connect('ccxm-'+room,{reliable:true});
  conn.on('open',()=>$('st').textContent='Connected to the TV 🎄');
  conn.on('data',()=>toast('Sent to the TV! 🎉'));
  conn.on('close',()=>{$('st').textContent='Reconnecting…';setTimeout(link,1500)})});
 peer.on('error',()=>{$('st').textContent='Open the TV page first…';setTimeout(link,3000)})}
async function send(b,k){if(!conn||!conn.open){toast('Not connected to the TV yet');return}
 toast('Sending…');conn.send({k,mime:b.type,buf:await b.arrayBuffer()})}
$('shot').onclick=()=>{const v=$('v'),w=v.videoWidth,h=v.videoHeight;if(!w)return;const c=document.createElement('canvas');c.width=1920;c.height=1080;
 let sw=w,sh=h,sx=0,sy=0;if(w/h>16/9){sw=h*16/9;sx=(w-sw)/2}else{sh=w*9/16;sy=(h-sh)/2}
 c.getContext('2d').drawImage(v,sx,sy,sw,sh,0,0,1920,1080);c.toBlob(b=>send(b,'photo'),'image/jpeg',.88)};
$('rec').onclick=()=>{if(rec&&rec.state=='recording'){rec.stop();return}
 const mt=['video/mp4','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'].find(m=>window.MediaRecorder&&MediaRecorder.isTypeSupported(m));
 if(!mt){toast('Video is not supported on this phone');return}
 chunks=[];rec=new MediaRecorder(stream,{mimeType:mt,videoBitsPerSecond:2500000});rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);
 rec.onstop=()=>{clearTimeout(tmo);$('rec').classList.remove('on');send(new Blob(chunks,{type:mt.split(';')[0]}),'video')};
 rec.start();$('rec').classList.add('on');toast('Recording… tap again to stop (max 10s)');tmo=setTimeout(()=>rec.state=='recording'&&rec.stop(),10000)};
$('flip').onclick=()=>{face=face=='user'?'environment':'user';cam()};
try{screen.orientation.lock('landscape').catch(()=>{})}catch(e){}
document.addEventListener('click',()=>{const d=document.documentElement;if(!document.fullscreenElement&&d.requestFullscreen)d.requestFullscreen().then(()=>screen.orientation.lock('landscape')).catch(()=>{})},{once:true});
cam();link();
</script></body></html>
